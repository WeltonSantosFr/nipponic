name: Android Beta Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/release-android.yml'
    tags:
      - 'v*-beta*'
      - 'beta-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (use "beta-latest" for rolling release)'
        required: false
        default: 'beta-latest'

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Publish Android Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Sync Capacitor Android
        run: pnpm --filter web cap:sync

      - name: Build Android Debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_release
        run: |
          VERSION="${{ github.ref_name }}"
          IS_ROLLING="false"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="beta-latest"
            IS_ROLLING="true"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ "$VERSION" = "beta-latest" ]; then
              IS_ROLLING="true"
            fi
          fi

          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_rolling=${IS_ROLLING}" >> "$GITHUB_OUTPUT"

          mkdir -p release-artifacts

          if [ "$IS_ROLLING" = "true" ]; then
            RELEASE_NAME="Nipponic Beta (Latest Build)"
            APK_NAME="nipponic-beta-latest.apk"
            cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${APK_NAME}"
            echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

            BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')
            {
              echo "### 🚀 Nipponic Beta (Latest Rolling Release)"
              echo ""
              echo "This release is automatically compiled and updated on every deploy/push to \`main\`."
              echo ""
              echo "- **Commit**: [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
              echo "- **Build Date**: ${BUILD_TIME}"
              echo "- **Direct Download**: [**nipponic-beta-latest.apk**](https://github.com/${{ github.repository }}/releases/download/beta-latest/nipponic-beta-latest.apk)"
              echo ""
              echo "> [!NOTE]"
              echo "> This is an automated debug build. You may need to allow \"Install unknown apps\" in your Android settings to install it."
            } > release_notes.md
          else
            RELEASE_NAME="Nipponic Beta ${VERSION}"
            APK_NAME="nipponic-${VERSION}.apk"
            cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${APK_NAME}"
            echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
            touch release_notes.md
          fi

      - name: Update rolling git tag
        if: steps.prepare_release.outputs.is_rolling == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta-latest
          git push -f origin beta-latest

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prepare_release.outputs.release_name }}
          body_path: ${{ steps.prepare_release.outputs.is_rolling == 'true' && 'release_notes.md' || '' }}
          prerelease: true
          draft: false
          files: release-artifacts/*.apk
          generate_release_notes: ${{ steps.prepare_release.outputs.is_rolling != 'true' }}
