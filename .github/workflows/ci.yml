name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TODO: make blocking once the existing ESLint warnings (apps/web) are cleaned up.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Type check
        run: pnpm check-types

      - name: Test (Unit & Integration)
        run: pnpm test

      - name: Bug Regression Tests
        run: pnpm test:regression

      # TODO: make blocking once the existing high/critical advisories are resolved.
      - name: Dependency audit (production, high severity)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build Web Application
        run: pnpm --filter web build

      - name: Run Visual Regression Tests
        run: pnpm --filter web run test:visual

      - name: Upload Playwright Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright Test Results Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: apps/web/test-results/
          retention-days: 14
