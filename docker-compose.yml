services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: nipponic-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - path: apps/api/.env
        required: false
    working_dir: /app/apps/api
    command: ["node_modules/.bin/tsx", "watch", "src/main.ts"]
    environment:
      - PORT=3001
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/shared/src:/app/packages/shared/src
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nipponic-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: nipponic-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - API_URL=http://api:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - WATCHPACK_POLLING=true
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/ui/src:/app/packages/ui/src
    depends_on:
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nipponic-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  nipponic-network:
    driver: bridge
